services:
  db:
    image: postgres:16
    container_name: disco-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: disco
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d disco"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
